<svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="roundedIcon">
      <rect x="0" y="0" width="56" height="56" rx="11"/>
    </clipPath>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7dbea"/>
    </linearGradient>
  </defs>

  <!-- Tri-Tone mark: blue/green top blocks, navy bottom block — same
       three-block layout as the original sketch, flattened (no gradients
       on the blocks themselves). The checkmark keeps its "glossy pop"
       identity (a dark rim, a soft white-to-gray gradient fill, a small
       specular highlight) but with NO blur (no feDropShadow) — this icon
       is only ever shown small (a ~40px navbar mark, a ~16px browser-tab
       favicon), and a blur radius tuned to look good in a large mockup
       just reads as smudged at those sizes; a plain wider solid-color
       stroke underneath reads as a crisp outline at any size instead.
       This rounded/bordered version is for the browser-tab favicon only —
       browsers render it as-is with no extra masking. The PWA/home-screen
       icons use live-trak-icon-touch.svg, a full-bleed unrounded version;
       block/checkmark geometry below is kept identical to that file so
       every logo instance in the app matches. -->
  <g clip-path="url(#roundedIcon)">
    <rect x="0" y="0" width="32" height="32" fill="#3b82f6"/>
    <rect x="32" y="0" width="24" height="32" fill="#4ade80"/>
    <rect x="0" y="32" width="56" height="24" fill="#333a5c"/>
    <line x1="32" y1="0" x2="32" y2="32" stroke="#ffffff" stroke-width="0.6" opacity="0.35"/>
    <line x1="0" y1="32" x2="56" y2="32" stroke="#ffffff" stroke-width="0.6" opacity="0.35"/>

    <polyline points="5,18 13,25 27,6" fill="none" stroke="#0b1120" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
    <polyline points="5,18 13,25 27,6" fill="none" stroke="url(#checkGrad)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="24" y1="9" x2="26" y2="7" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
