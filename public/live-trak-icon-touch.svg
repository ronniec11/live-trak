<svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7dbea"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed, no rounded corners baked in — iOS applies its own corner
       mask over this image, and a self-rounded icon gets double-masked/
       cropped unevenly under that. Block/checkmark geometry kept identical
       to live-trak-icon.svg so every logo instance in the app matches.
       Checkmark has no blur (no feDropShadow) — this only ever renders
       small (a ~192px home-screen icon downscaled from this, in practice
       often much smaller), and a blur radius tuned for a large mockup
       just reads as smudged at those sizes; a plain wider solid-color
       stroke underneath reads as a crisp outline at any size instead. -->
  <rect x="0" y="0" width="32" height="32" fill="#3b82f6"/>
  <rect x="32" y="0" width="24" height="32" fill="#4ade80"/>
  <rect x="0" y="32" width="56" height="24" fill="#333a5c"/>
  <line x1="32" y1="0" x2="32" y2="32" stroke="#ffffff" stroke-width="0.6" opacity="0.35"/>
  <line x1="0" y1="32" x2="56" y2="32" stroke="#ffffff" stroke-width="0.6" opacity="0.35"/>

  <polyline points="5,18 13,25 27,6" fill="none" stroke="#0b1120" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <polyline points="5,18 13,25 27,6" fill="none" stroke="url(#checkGrad)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="24" y1="9" x2="26" y2="7" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
</svg>
