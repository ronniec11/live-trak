<svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3f66"/>
      <stop offset="100%" stop-color="#141b30"/>
    </linearGradient>
    <radialGradient id="glossGrad" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.6" flood-color="#0b1120" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Full-bleed, no rounded corners baked in and no edge border — iOS
       applies its own corner mask over this image, and a self-rounded or
       bordered icon gets double-masked/cropped unevenly under that. -->
  <rect x="0" y="0" width="56" height="56" fill="url(#bgGrad)"/>

  <!-- Floor plan grid — smaller than the favicon's, specifically to leave
       a genuine gap before the brackets below (confirmed by testing: they
       need to stay far from the true corner to clear iOS's mask, which
       leaves less room here than the favicon has to work with). -->
  <rect x="14" y="16" width="15" height="12" fill="none" stroke="#93c5fd" stroke-width="0.7" opacity="0.8"/>
  <rect x="29" y="16" width="13" height="12" fill="none" stroke="#93c5fd" stroke-width="0.7" opacity="0.8"/>
  <rect x="14" y="28" width="28" height="12" fill="none" stroke="#93c5fd" stroke-width="0.7" opacity="0.8"/>

  <!-- Highlighted cells — blue and green so the icon isn't a single flat color -->
  <rect x="14.4" y="16.4" width="14.2" height="11.2" fill="#60a5fa" opacity="0.3"/>
  <rect x="29.4" y="16.4" width="12.2" height="11.2" fill="#4ade80" opacity="0.3"/>

  <!-- Top gloss for a raised, glassy feel -->
  <rect x="0" y="0" width="56" height="56" fill="url(#glossGrad)"/>

  <!-- Checkmark — white -->
  <polyline points="16,22 21,26 28,18" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)"/>

  <!-- Corner brackets — white. Confirmed by testing (twice) that this
       icon needs real distance from the true corner to clear iOS's mask —
       unlike the favicon/logo, which never get masked and can sit much
       closer to their corners. Do not match this to the favicon's
       position again; it visibly clips here. -->
  <g stroke="#ffffff" stroke-width="1.3" opacity="0.9">
    <line x1="8"  y1="10" x2="13" y2="10"/>
    <line x1="8"  y1="10" x2="8"  y2="15"/>
    <line x1="48" y1="10" x2="43" y2="10"/>
    <line x1="48" y1="10" x2="48" y2="15"/>
    <line x1="8"  y1="46" x2="13" y2="46"/>
    <line x1="8"  y1="46" x2="8"  y2="41"/>
    <line x1="48" y1="46" x2="43" y2="46"/>
    <line x1="48" y1="46" x2="48" y2="41"/>
  </g>
</svg>
