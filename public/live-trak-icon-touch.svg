<svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3f66"/>
      <stop offset="100%" stop-color="#141b30"/>
    </linearGradient>
    <radialGradient id="glossGrad" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.6" flood-color="#0b1120" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Full-bleed, no rounded corners baked in and no edge border — iOS
       applies its own corner mask over this image, and a self-rounded or
       bordered icon gets double-masked/cropped unevenly under that. -->
  <rect x="0" y="0" width="56" height="56" fill="url(#bgGrad)"/>

  <!-- Floor plan grid — light blue instead of gray, more visible -->
  <rect x="8"  y="10" width="19" height="16" fill="none" stroke="#93c5fd" stroke-width="0.7" opacity="0.8"/>
  <rect x="27" y="10" width="16" height="16" fill="none" stroke="#93c5fd" stroke-width="0.7" opacity="0.8"/>
  <rect x="8"  y="26" width="35" height="16" fill="none" stroke="#93c5fd" stroke-width="0.7" opacity="0.8"/>

  <!-- Highlighted cells — blue and green so the icon isn't a single flat color -->
  <rect x="8.4" y="10.4" width="18.2" height="15.2" fill="#60a5fa" opacity="0.3"/>
  <rect x="27.4" y="10.4" width="15.2" height="15.2" fill="#4ade80" opacity="0.3"/>

  <!-- Top gloss for a raised, glassy feel -->
  <rect x="0" y="0" width="56" height="56" fill="url(#glossGrad)"/>

  <!-- Checkmark — white -->
  <polyline points="11,18 17,24 26,13" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)"/>

  <!-- Corner brackets — white, pulled in further from the edges than a
       favicon/logo context needs: iOS's own corner mask curves in more
       aggressively than this icon's own margins account for, so brackets
       placed close to the edge get visually clipped by that mask. -->
  <g stroke="#ffffff" stroke-width="1.1" opacity="0.9">
    <line x1="6"  y1="9"  x2="10" y2="9"/>
    <line x1="6"  y1="9"  x2="6"  y2="13"/>
    <line x1="50" y1="9"  x2="46" y2="9"/>
    <line x1="50" y1="9"  x2="50" y2="13"/>
    <line x1="6"  y1="47" x2="10" y2="47"/>
    <line x1="6"  y1="47" x2="6"  y2="43"/>
    <line x1="50" y1="47" x2="46" y2="47"/>
    <line x1="50" y1="47" x2="50" y2="43"/>
  </g>
</svg>
