<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Live-Trak" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/live-trak-icon.svg" />
    <title>Live-Trak</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Applies the saved theme before React mounts/paints anything, so a
         user who picked light mode doesn't see a flash of dark first. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('live-trak_theme')
          if (t === 'light') document.documentElement.classList.remove('dark')
          else document.documentElement.classList.add('dark')
        } catch (e) { document.documentElement.classList.add('dark') }
      })()
    </script>
    <!-- Polyfills for Safari and older browsers (used by pdfjs-dist) -->
    <script>
      if (typeof Promise.withResolvers === 'undefined') {
        Promise.withResolvers = function() {
          let resolve, reject
          const promise = new Promise((res, rej) => { resolve = res; reject = rej })
          return { promise, resolve, reject }
        }
      }
      if (typeof URL.parse === 'undefined') {
        URL.parse = function(url, base) {
          try { return new URL(url, base) } catch { return null }
        }
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
