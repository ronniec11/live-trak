<svg viewBox="0 0 280 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3f66"/>
      <stop offset="100%" stop-color="#141b30"/>
    </linearGradient>
    <radialGradient id="glossGrad" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.6" flood-color="#0b1120" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Icon — kept identical to live-trak-icon.svg / live-trak-icon-touch.svg
       so every logo instance in the app matches. -->
  <g transform="translate(0,2)">
    <rect x="1" y="1" width="54" height="54" rx="11" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.35"/>
    <rect x="11" y="13" width="18" height="15" fill="none" stroke="#93c5fd" stroke-width="0.7" opacity="0.8"/>
    <rect x="29" y="13" width="16" height="15" fill="none" stroke="#93c5fd" stroke-width="0.7" opacity="0.8"/>
    <rect x="11" y="28" width="34" height="15" fill="none" stroke="#93c5fd" stroke-width="0.7" opacity="0.8"/>
    <rect x="11.4" y="13.4" width="17.2" height="14.2" fill="#60a5fa" opacity="0.3"/>
    <rect x="29.4" y="13.4" width="15.2" height="14.2" fill="#4ade80" opacity="0.3"/>
    <rect x="1" y="1" width="54" height="54" rx="11" fill="url(#glossGrad)"/>
    <polyline points="14,20 19,26 28,16" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)"/>
    <g stroke="#ffffff" stroke-width="1.3" opacity="0.9">
      <line x1="8"  y1="10" x2="13" y2="10"/>
      <line x1="8"  y1="10" x2="8"  y2="15"/>
      <line x1="48" y1="10" x2="43" y2="10"/>
      <line x1="48" y1="10" x2="48" y2="15"/>
      <line x1="8"  y1="46" x2="13" y2="46"/>
      <line x1="8"  y1="46" x2="8"  y2="41"/>
      <line x1="48" y1="46" x2="43" y2="46"/>
      <line x1="48" y1="46" x2="48" y2="41"/>
    </g>
  </g>

  <!-- Wordmark: "Live-Trak" -->
  <text
    x="70"
    y="39"
    font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="34"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#1c1c1a"
  >Live-Trak</text>
</svg>
