<svg viewBox="0 0 280 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glossGrad" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shadeGrad" x1="0%" y1="55%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.9" flood-color="#0f172a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Icon — rich blue gradient rather than flat near-black, so it holds
       up against both light and dark navbar backgrounds -->
  <g transform="translate(0,2)">
    <rect x="1" y="1" width="54" height="54" rx="12" fill="url(#bgGrad)"/>
    <g stroke="#ffffff" stroke-width="0.5" opacity="0.16">
      <line x1="19" y1="8" x2="19" y2="48"/>
      <line x1="37" y1="8" x2="37" y2="48"/>
      <line x1="8" y1="23" x2="48" y2="23"/>
    </g>
    <rect x="1" y="1" width="54" height="54" rx="12" fill="url(#shadeGrad)"/>
    <rect x="1" y="1" width="54" height="54" rx="12" fill="url(#glossGrad)"/>
    <g stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M8 14 V10 a2 2 0 0 1 2-2 H14"/>
      <path d="M48 14 V10 a2 2 0 0 0 -2-2 H42"/>
      <path d="M8 42 V46 a2 2 0 0 0 2 2 H14"/>
      <path d="M48 42 V46 a2 2 0 0 1 -2 2 H42"/>
    </g>
    <path d="M16 29 L24 38 L41 18" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)"/>
  </g>

  <!-- Wordmark: "Live-Trak" -->
  <text
    x="70"
    y="39"
    font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="34"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#1c1c1a"
  >Live-Trak</text>
</svg>
