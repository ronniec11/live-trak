<svg viewBox="0 0 280 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="roundedIcon">
      <rect x="0" y="0" width="56" height="56" rx="11"/>
    </clipPath>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7dbea"/>
    </linearGradient>
    <filter id="checkPop" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0.8" dy="1.3" stdDeviation="0.8" flood-color="#0b1120" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Icon — kept identical to live-trak-icon.svg / live-trak-icon-touch.svg
       so every logo instance in the app matches. -->
  <g transform="translate(0,2)">
    <g clip-path="url(#roundedIcon)">
      <rect x="0" y="0" width="32" height="32" fill="#3b82f6"/>
      <rect x="32" y="0" width="24" height="32" fill="#4ade80"/>
      <rect x="0" y="32" width="56" height="24" fill="#333a5c"/>
      <line x1="32" y1="0" x2="32" y2="32" stroke="#ffffff" stroke-width="0.6" opacity="0.35"/>
      <line x1="0" y1="32" x2="56" y2="32" stroke="#ffffff" stroke-width="0.6" opacity="0.35"/>

      <polyline points="5,18 13,25 27,6" fill="none" stroke="#0b1120" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" transform="translate(0.5,0.5)"/>
      <polyline points="5,18 13,25 27,6" fill="none" stroke="url(#checkGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#checkPop)"/>
      <line x1="24" y1="9" x2="26" y2="7" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
    </g>
  </g>

  <!-- Wordmark: "Live-Trak" -->
  <text
    x="70"
    y="39"
    font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="34"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#f3f4f6"
  >Live-Trak</text>
</svg>
