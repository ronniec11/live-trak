<svg viewBox="0 0 280 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon background -->
  <rect x="0" y="2" width="56" height="56" rx="11" fill="#141a2e"/>

  <!-- Floor plan grid lines -->
  <rect x="8"  y="10" width="19" height="16" fill="none" stroke="#2a3350" stroke-width="0.7"/>
  <rect x="27" y="10" width="16" height="16" fill="none" stroke="#2a3350" stroke-width="0.7"/>
  <rect x="8"  y="26" width="35" height="16" fill="none" stroke="#2a3350" stroke-width="0.7"/>

  <!-- Highlighted cells — blue and green so the icon isn't a single flat color -->
  <rect x="8.4" y="10.4" width="18.2" height="15.2" fill="#60a5fa" opacity="0.25"/>
  <rect x="27.4" y="10.4" width="15.2" height="15.2" fill="#4ade80" opacity="0.25"/>

  <!-- Checkmark -->
  <polyline points="11,18 17,24 26,13" fill="none" stroke="url(#blueGrad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Corner brackets -->
  <line x1="4"  y1="7"  x2="9"  y2="7"  stroke="#60a5fa" stroke-width="1.1" opacity="0.7"/>
  <line x1="4"  y1="7"  x2="4"  y2="12" stroke="#60a5fa" stroke-width="1.1" opacity="0.7"/>
  <line x1="52" y1="7"  x2="47" y2="7"  stroke="#60a5fa" stroke-width="1.1" opacity="0.7"/>
  <line x1="52" y1="7"  x2="52" y2="12" stroke="#60a5fa" stroke-width="1.1" opacity="0.7"/>
  <line x1="4"  y1="53" x2="9"  y2="53" stroke="#60a5fa" stroke-width="1.1" opacity="0.7"/>
  <line x1="4"  y1="53" x2="4"  y2="48" stroke="#60a5fa" stroke-width="1.1" opacity="0.7"/>
  <line x1="52" y1="53" x2="47" y2="53" stroke="#60a5fa" stroke-width="1.1" opacity="0.7"/>
  <line x1="52" y1="53" x2="52" y2="48" stroke="#60a5fa" stroke-width="1.1" opacity="0.7"/>

  <!-- Wordmark: "scribilis" -->
  <text
    x="70"
    y="39"
    font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="40"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#f3f4f6"
  >scribilis</text>
</svg>
